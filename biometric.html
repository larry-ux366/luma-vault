const APP_ORIGIN='https://n-rb5uhoxdjhfptzppewfxburvgspsc3fviptnmgy-0lu-script.googleusercontent.com',STORE='luma-biometric-prf-v1';const nonce=new URLSearchParams(location.search).get('request');const $=id=>document.getElementById(id);let request=null,working=false;const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),random=()=>crypto.getRandomValues(new Uint8Array(32));

async function prfGet(id,salt){const assertion=await navigator.credentials.get({publicKey:{challenge:random(),rpId:location.hostname,allowCredentials:[{type:'public-key',id:bytes(id)}],userVerification:'required',timeout:60000,extensions:{prf:{eval:{first:bytes(salt)}}}}});const auth=new Uint8Array(assertion.response.authenticatorData);if(!(auth[32]&4))throw Error('Device verification required.');const out=assertion.getClientExtensionResults().prf?.results?.first;if(!out)throw Error('ဒီ Passkey က Fingerprint unlock အတွက် PRF မပံ့ပိုးသေးပါ။ Master PW နဲ့ ဆက်သုံးပါ။');return out;}
